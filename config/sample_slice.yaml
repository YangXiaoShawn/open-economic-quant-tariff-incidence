name: vertical_slice_v1

sample:
  name: section301_list3_slice
  description: >
    First vertical slice. Treated group: HS6 headings whose 8-digit children are
    fully covered by Section 301 List 3 (effective 2018-09-24). Control group:
    HS6 headings in the same HS2 chapters with zero coverage under Lists 1, 2
    and 3. Products whose HS6 heading is only partly covered are excluded from
    both groups and reported separately, because assigning them to either would
    introduce treatment measurement error.
  hs_level: HS6
  hs2_chapters: ["39", "40", "44", "48", "73", "76", "84", "85", "87", "94"]
  hs6_products: []          # empty means "derive from the tariff schedule"
  treated_country_code: "5700"
  comparison_country_codes:
    - "5520"   # Vietnam
    - "5490"   # Thailand
    - "5590"   # Malaysia
    - "5330"   # India
    - "5800"   # Korea, South
    - "5880"   # Taiwan
    - "2010"   # Mexico
    - "1220"   # Canada
  start_month: "2017-01"
  end_month: "2019-08"
  max_api_calls: 40

# Sample-window rationale
# -----------------------
# The window ends 2019-08 on purpose. Section 301 List 4A took effect
# 2019-09-01 and covers most remaining consumer goods, which would contaminate
# the never-treated control group. Extending past that date without a List 4A
# parser would mislabel treated products as controls. The current-data
# extension (milestone M9) is descriptive only and is reported separately.

estimation:
  event_window_pre: 12
  event_window_post: 10
  reference_event_time: -1
  cluster_on: ["hs6"]
  winsorize_unit_value_pct: 1.0
  min_pretreatment_months: 6
  ppml_max_iter: 200
  ppml_tol: 1.0e-9

episodes: []
